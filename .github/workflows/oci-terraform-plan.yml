name: OCI Terraform

on:
  workflow_dispatch:
    inputs:
      verify_read_only:
        description: Prove the plan identity cannot mutate the dev VCN
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/oci-terraform-plan.yml
      - .github/workflows/oci-terraform-apply.yml
      - bootstrap/**
      - workload/**
      - scripts/**

permissions: {}

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.16.4
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, test, stage, prod]
    defaults:
      run:
        shell: bash
        working-directory: workload
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
      OCI_STATE_NAMESPACE: ${{ vars.OCI_STATE_NAMESPACE }}
      TF_VAR_parent_compartment_id: ${{ vars.OCI_PARENT_COMPARTMENT_ID }}
      TF_VAR_region: ${{ vars.OCI_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate to OCI
        uses: ./.github/actions/oci-rpst # zizmor: ignore[self-repository]
        with:
          client_identifier: ${{ secrets.OCI_OIDC_CLIENT_IDENTIFIER }}
          identity_domain_url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          tenancy_ocid: ${{ vars.OCI_TENANCY_OCID }}
          region: ${{ vars.OCI_REGION }}
          audience: oci://${{ github.repository }}/plan

      - name: Initialize state
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${OCI_STATE_BUCKET}" \
            -backend-config="namespace=${OCI_STATE_NAMESPACE}" \
            -backend-config="region=${TF_VAR_region}" \
            -backend-config="key=environments/${ENVIRONMENT}/terraform.tfstate"

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file="environments/${ENVIRONMENT}.tfvars"

      - name: Verify plan identity is read-only
        if: inputs.verify_read_only && matrix.environment == 'dev'
        run: |
          probe_log="${RUNNER_TEMP}/plan-mutation-probe.log"

          set +e
          terraform apply \
            -input=false \
            -auto-approve \
            -lock=false \
            -no-color \
            -refresh=false \
            -var-file="environments/${ENVIRONMENT}.tfvars" \
            -var="change_tier=authorization-probe" \
            >"${probe_log}" 2>&1
          probe_status=$?
          set -e

          if [[ ${probe_status} -eq 0 ]]; then
            echo "Plan identity unexpectedly mutated OCI resources" >&2
            exit 1
          fi

          if ! grep -Eqi "not authorized|NotAuthorizedOrNotFound|authorization failed" "${probe_log}"; then
            echo "Plan mutation probe failed for a reason other than OCI authorization" >&2
            exit 1
          fi

          terraform plan \
            -detailed-exitcode \
            -input=false \
            -no-color \
            -var-file="environments/${ENVIRONMENT}.tfvars"
