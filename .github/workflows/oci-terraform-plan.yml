name: Terraform plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/oci-terraform-plan.yml
      - .github/workflows/oci-terraform-apply.yml
      - bootstrap/**
      - workload/**
      - scripts/**

permissions: {}

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.16.4
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, test, stage, prod]
    defaults:
      run:
        shell: bash
        working-directory: workload
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
      OCI_STATE_NAMESPACE: ${{ vars.OCI_STATE_NAMESPACE }}
      TF_VAR_parent_compartment_id: ${{ vars.OCI_PARENT_COMPARTMENT_ID }}
      TF_VAR_region: ${{ vars.OCI_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate to OCI
        id: oci-auth
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2.0.0
        with:
          oidc_client_identifier: ${{ secrets.OCI_OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          oci_tenancy: ${{ vars.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
          oidc_audience: oci://${{ github.repository }}/plan
          oci_profile: GITHUB_OIDC
          res_type: github-terraform-oidc
          rpst_exp: "20"

      - name: Show federated subject
        env:
          OCI_SESSION_TOKEN_PATH: ${{ steps.oci-auth.outputs.oci_session_token_path }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os

          token = open(os.environ["OCI_SESSION_TOKEN_PATH"], encoding="utf-8").read().strip()
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          visible = {
              key: value
              for key, value in claims.items()
              if (
                  key in ("sub", "iss", "aud", "ptype", "resource_sub_type")
                  or key.startswith(("res_", "var_ext_", "var_name"))
              )
          }
          visible["claim_keys"] = sorted(claims)
          print(json.dumps(visible, indent=2, sort_keys=True))
          PY

      - name: Initialize state
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${OCI_STATE_BUCKET}" \
            -backend-config="namespace=${OCI_STATE_NAMESPACE}" \
            -backend-config="region=${TF_VAR_region}" \
            -backend-config="key=environments/${ENVIRONMENT}/terraform.tfstate"

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file="environments/${ENVIRONMENT}.tfvars"
