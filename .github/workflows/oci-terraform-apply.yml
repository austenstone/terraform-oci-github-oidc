name: Terraform apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to change
        required: true
        type: choice
        options: [dev, test, stage, prod]
      operation:
        description: Terraform operation
        required: true
        type: choice
        options: [apply, destroy]

permissions: {}

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.16.4
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    name: ${{ inputs.operation == 'apply' && 'Apply' || 'Destroy' }} (${{ inputs.environment }})
    runs-on: ubuntu-slim
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: workload
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
      OCI_STATE_NAMESPACE: ${{ vars.OCI_STATE_NAMESPACE }}
      TF_VAR_parent_compartment_id: ${{ vars.OCI_PARENT_COMPARTMENT_ID }}
      TF_VAR_region: ${{ vars.OCI_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate to OCI
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2.0.0
        with:
          oidc_client_identifier: ${{ secrets.OCI_OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          oci_tenancy: ${{ vars.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
          oidc_audience: oci://${{ github.repository }}/apply/${{ inputs.environment }}
          oci_profile: GITHUB_OIDC
          res_type: github-terraform-oidc
          rpst_exp: "20"

      - name: Initialize state
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${OCI_STATE_BUCKET}" \
            -backend-config="namespace=${OCI_STATE_NAMESPACE}" \
            -backend-config="region=${TF_VAR_region}" \
            -backend-config="key=environments/${ENVIRONMENT}/terraform.tfstate"

      - name: Plan changes
        if: inputs.operation == 'apply'
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file="environments/${ENVIRONMENT}.tfvars" \
            -out=tfplan

      - name: Plan destruction
        if: inputs.operation == 'destroy'
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -no-color \
            -var-file="environments/${ENVIRONMENT}.tfvars" \
            -out=tfplan

      - name: Apply plan
        run: terraform apply -input=false -auto-approve tfplan
