name: OCI Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to change
        required: true
        type: choice
        options: [dev, test, stage, prod]
      operation:
        description: Terraform operation
        required: true
        type: choice
        options: [apply, destroy]
      verify_cross_environment:
        description: Prove the dev identity cannot mutate the test VCN
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.16.4
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    name: ${{ inputs.operation == 'apply' && 'Apply' || 'Destroy' }} (${{ inputs.environment }})
    runs-on: ubuntu-slim
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: workload
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
      OCI_STATE_NAMESPACE: ${{ vars.OCI_STATE_NAMESPACE }}
      TF_VAR_parent_compartment_id: ${{ vars.OCI_PARENT_COMPARTMENT_ID }}
      TF_VAR_region: ${{ vars.OCI_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate to OCI
        uses: ./.github/actions/oci-rpst # zizmor: ignore[self-repository]
        with:
          client_identifier: ${{ secrets.OCI_OIDC_CLIENT_IDENTIFIER }}
          identity_domain_url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          tenancy_ocid: ${{ vars.OCI_TENANCY_OCID }}
          region: ${{ vars.OCI_REGION }}
          audience: oci://${{ github.repository }}/apply/${{ inputs.environment }}

      - name: Initialize state
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${OCI_STATE_BUCKET}" \
            -backend-config="namespace=${OCI_STATE_NAMESPACE}" \
            -backend-config="region=${TF_VAR_region}" \
            -backend-config="key=environments/${ENVIRONMENT}/terraform.tfstate"

      - name: Plan changes
        if: inputs.operation == 'apply'
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file="environments/${ENVIRONMENT}.tfvars" \
            -out=tfplan

      - name: Plan destruction
        if: inputs.operation == 'destroy'
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -no-color \
            -var-file="environments/${ENVIRONMENT}.tfvars" \
            -out=tfplan

      - name: Apply plan
        run: terraform apply -input=false -auto-approve tfplan

      - name: Verify dev cannot mutate test
        if: inputs.verify_cross_environment && inputs.environment == 'dev' && inputs.operation == 'apply'
        run: |
          probe_log="${RUNNER_TEMP}/cross-environment-probe.log"

          terraform init -input=false -reconfigure \
            -backend-config="bucket=${OCI_STATE_BUCKET}" \
            -backend-config="namespace=${OCI_STATE_NAMESPACE}" \
            -backend-config="region=${TF_VAR_region}" \
            -backend-config="key=environments/test/terraform.tfstate"

          set +e
          terraform apply \
            -input=false \
            -auto-approve \
            -lock=false \
            -no-color \
            -refresh=false \
            -var-file="environments/test.tfvars" \
            -var="change_tier=authorization-probe" \
            >"${probe_log}" 2>&1
          probe_status=$?
          set -e

          if [[ ${probe_status} -eq 0 ]]; then
            echo "Dev identity unexpectedly mutated the test environment" >&2
            exit 1
          fi

          if ! grep -Eqi "not authorized|NotAuthorizedOrNotFound|authorization failed" "${probe_log}"; then
            echo "Cross-environment probe failed for a reason other than OCI authorization" >&2
            exit 1
          fi
