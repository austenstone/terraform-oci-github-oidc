name: OCI authorization probes

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Authorization boundary to verify
        required: true
        type: choice
        options: [wrong-audience, wrong-workflow]

permissions: {}

jobs:
  probe:
    name: ${{ inputs.scenario }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Request rejected audience
        id: wrong_audience
        if: inputs.scenario == 'wrong-audience'
        continue-on-error: true
        uses: ./.github/actions/oci-rpst # zizmor: ignore[self-repository]
        with:
          client_identifier: ${{ secrets.OCI_OIDC_CLIENT_IDENTIFIER }}
          identity_domain_url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          tenancy_ocid: ${{ vars.OCI_TENANCY_OCID }}
          region: ${{ vars.OCI_REGION }}
          audience: oci://${{ github.repository }}/invalid

      - name: Verify rejected audience
        if: inputs.scenario == 'wrong-audience'
        env:
          EXCHANGE_OUTCOME: ${{ steps.wrong_audience.outcome }}
        run: |
          if [[ "${EXCHANGE_OUTCOME}" != "failure" ]]; then
            echo "OCI accepted an audience outside the trust allowlist" >&2
            exit 1
          fi

      - name: Authenticate unauthorized workflow
        id: wrong_workflow
        if: inputs.scenario == 'wrong-workflow'
        continue-on-error: true
        uses: ./.github/actions/oci-rpst # zizmor: ignore[self-repository]
        with:
          client_identifier: ${{ secrets.OCI_OIDC_CLIENT_IDENTIFIER }}
          identity_domain_url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          tenancy_ocid: ${{ vars.OCI_TENANCY_OCID }}
          region: ${{ vars.OCI_REGION }}
          audience: oci://${{ github.repository }}/plan

      - name: Verify unauthorized workflow
        if: inputs.scenario == 'wrong-workflow'
        env:
          EXCHANGE_OUTCOME: ${{ steps.wrong_workflow.outcome }}
        run: |
          if [[ "${EXCHANGE_OUTCOME}" != "failure" ]]; then
            echo "OCI issued an RPST to an unexpected workflow" >&2
            exit 1
          fi
